x<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tap to Unlock</title>
  <meta name="description" content="A small scavenger hunt that unlocks something real." />
  <style>
    :root{
      --bg:#0b0d12;
      --text:#e8ecf7;
      --muted:#a8b0c6;
      --line:rgba(232,236,247,.12);
      --accent:#c9d4ff;
      --ok:#b7ffda;
      --bad:#ffb7c8;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 700px at 30% 10%, rgba(201,212,255,.10), transparent 55%),
                  radial-gradient(900px 600px at 70% 75%, rgba(183,255,218,.08), transparent 60%),
                  var(--bg);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .wrap{width:min(900px, 100%)}
    .top{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:14px;
      gap:12px;
    }
    .brand{
      font-size:12px; letter-spacing:.28em; text-transform:uppercase;
      color:var(--muted);
    }
    .pill{
      font-size:12px; color:var(--muted);
      border:1px solid var(--line);
      padding:8px 10px;
      border-radius:999px;
      display:flex; align-items:center; gap:10px;
      background: rgba(17,21,33,.35);
      backdrop-filter: blur(8px);
    }
    .dot{width:8px;height:8px;border-radius:50%; background: rgba(201,212,255,.55)}
    .card{
      background: linear-gradient(180deg, rgba(17,21,33,.92), rgba(15,19,32,.82));
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .inner{padding:22px}
    h1{
      margin:0 0 10px;
      font-weight:650;
      letter-spacing:-.02em;
      font-size: clamp(22px, 3vw, 34px);
      line-height:1.15;
    }
    p{margin:0 0 14px; color:var(--muted); line-height:1.55}
    .divider{height:1px; background:var(--line); margin:18px 0}
    .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
    .btn{
      border:1px solid var(--line);
      color:var(--text);
      background: rgba(232,236,247,.05);
      padding:12px 14px;
      border-radius: 14px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(232,236,247,.08)}
    .btn:active{transform: translateY(0px) scale(.99)}
    .btn.primary{
      border-color: rgba(201,212,255,.25);
      background: rgba(201,212,255,.10);
    }
    .btn.ghost{background: transparent}
    .btn.good{
      border-color: rgba(183,255,218,.25);
      background: rgba(183,255,218,.10);
    }
    .small{font-size:13px}
    .input{
      width:min(520px, 100%);
      padding:12px 14px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.15);
      color:var(--text);
      outline:none;
    }
    .input:focus{
      border-color: rgba(201,212,255,.35);
      box-shadow: 0 0 0 4px rgba(201,212,255,.08);
    }
    .hint{
      font-size:13px;
      color: rgba(168,176,198,.95);
      border-left: 2px solid rgba(201,212,255,.25);
      padding:10px 12px;
      background: rgba(201,212,255,.06);
      border-radius: 12px;
    }
    .status{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .progress{display:flex; gap:8px; align-items:center}
    .step{
      width: 26px; height: 6px;
      border-radius: 999px;
      background: rgba(232,236,247,.10);
      border:1px solid rgba(232,236,247,.10);
    }
    .step.on{
      background: rgba(201,212,255,.35);
      border-color: rgba(201,212,255,.25);
    }
    .fade-in{animation: fade .28s ease both}
    @keyframes fade{
      from{opacity:0; transform: translateY(6px)}
      to{opacity:1; transform: translateY(0)}
    }

    /* Grid cards */
    .vault-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    @media (max-width:720px){ .vault-grid{grid-template-columns: 1fr} }

    .drawer{
      border:1px solid var(--line);
      border-radius: 16px;
      background: rgba(0,0,0,.12);
      padding:14px;
      min-height: 92px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
      position: relative;
      overflow:hidden;
    }
    .drawer:hover{transform: translateY(-1px); background: rgba(232,236,247,.06)}
    .drawer h3{margin:0 0 6px; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
    .drawer .label{font-size:16px; margin:0; color:var(--text)}
    .drawer .lock{
      position:absolute; right:12px; top:12px;
      font-size:12px; color: rgba(168,176,198,.9);
      border:1px solid var(--line);
      padding:6px 8px; border-radius: 999px;
      background: rgba(17,21,33,.45);
    }

    .footer{
      margin-top:12px;
      display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
      color: var(--muted);
      font-size:12px;
    }
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}

    /* Modal + Flip */
    .modal{
      position: fixed;
      inset: 0;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 22px;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(6px);
      z-index: 9999;
    }
    .modal.on{ display:flex; }

    .modalCard{
  width: min(920px, 100%);
  max-height: min(86vh, 920px);
  display:flex;
  flex-direction:column;
  border-radius: 20px;
  border:1px solid rgba(232,236,247,.16);
  background: linear-gradient(180deg, rgba(17,21,33,.98), rgba(15,19,32,.92));
  box-shadow: 0 30px 90px rgba(0,0,0,.6);
  overflow:hidden;
}


    .modalTopBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 14px 16px;
      border-bottom:1px solid var(--line);
    }
    .modalTopBar .title{
      font-size:12px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color: var(--muted);
    }

    .flipWrap{
      position: relative;
      transform-style: preserve-3d;
      transition: transform .55s ease;
      perspective: 1200px;
      min-height: 320px;
      cursor:pointer;
    }
    .flipWrap.flipped{ transform: rotateY(180deg); }

    .flipFace{ backface-visibility: hidden; }
    .flipBack{
      position:absolute;
      inset:0;
      transform: rotateY(180deg);
    }

    .modalFront{ padding:22px; }
    .modalFront h2{ margin:0; font-size:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .modalFront p{ margin:10px 0 0; color:var(--text); }

    .modalBack{ display:flex; flex-direction: column; }
    .modalMediaWrap{
  flex: 1;
  min-height: 260px;
  padding: 14px;
  background: rgba(0,0,0,.18);
  display:flex;
  align-items:center;
  justify-content:center;
}

    .modalMedia{
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display:block;
  border-radius: 14px;
}

    .modalCaption{
  border-top:1px solid var(--line);
  padding:14px 16px;
  color: var(--text);
  line-height:1.45;
  font-size: 14px;
}
.modalCaption .capTitle{
  display:block;
  font-size: 12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">PRIVATE ACCESS</div>
      <div class="pill"><span class="dot"></span><span id="pillText">ready</span></div>
    </div>

    <div class="card">
      <div class="inner" id="app"></div>
    </div>

    <div class="footer">
      <button class="btn ghost small" id="resetBtn" title="Reset this experience">reset</button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modalCard" role="dialog" aria-modal="true" aria-label="Media viewer">
      <div class="modalTopBar">
        <div class="title" id="modalTitle">PHOTO</div>
        <button class="btn ghost small" id="closeModal">close</button>
      </div>

      <div class="flipWrap" id="flipWrap">
        <!-- FRONT -->
        <div class="flipFace modalFront">
          <h2 id="frontLabel">Pic</h2>
          <p id="frontHint">tap to reveal</p>
        </div>

        <!-- BACK -->
        <div class="flipFace flipBack modalBack">
          <div class="modalMediaWrap" id="modalMediaWrap"></div>
          <div class="modalCaption" id="modalCaption"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  try{
    // ====== EDIT THESE (PERSONALIZE) ======
    const CONFIG = {
      recipientName: "family legend",
      code1: "Power Play",
      code2: "2002",
      code3: "John Wayne Casserole",

      // Files are in repo ROOT (same folder as index.html)
      people: [
        {
          key:"grandpa",
          name:"Grandpa",
          photos:[
            { src:"grandpa1.mov", caption:"eWe senpai grammpy" },
            { src:"grandpa2.jpg", caption:"korban and grandpa big chillin" },
            { src:"grandpa3.JPG", caption:"I wonder who is who" },
            { src:"grandpa4.JPG", caption:"our younger days" },
            { src:"grandpa5.jpg", caption:"can you help me take off my shirt??" }, /* HEIC may not display on many devices */
            { src:"grandpa6.mov", caption:"TYLER" },
            { src:"grandpa7.JPG", caption:"aw" }
          ]
        },

       {
    key:"karen",
    name:"Karen",
    photos:[
      { src:"karen1.jpg", caption:"I hope your winning poker karen...Peachy, get your head in the game please." },
      { src:"karen2.jpg", caption:"my day oner" },
      { src:"karen3.JPG", caption:"i still remember that house...it was like a maze, and my favorite part was the pool heehee" },
      { src:"karen4.JPG", caption:"I actually don't know where this is" },
      { src:"karen5.jpg", caption:"girl boss" }
    ]
  },

  {
    key:"kevin",
    name:"Kevin",
    photos:[
      { src:"kevin3.JPG", caption:"why are you looking at me like that..." },
      { src:"kevin1.JPG", caption:"ok now your scaring me" },
      { src:"kevin2.jpg", caption:"(insert laughing emoji)" },
      { src:"kevin4.JPG", caption:"gangsta twinem" },
      { src:"kevin5.JPG", caption:"throwback" }
    ]
  },

  {
    key:"pat",
    name:"Pat",
    photos:[
      { src:"pat.JPG",  caption:"lol" },
      { src:"pat1.JPG", caption:"alright who was being annoying..." },
      { src:"pat2.JPG", caption:"pwartyyy" },
      { src:"pat3.JPG", caption:"(insert awe emoji)" },
      { src:"pat4.JPG", caption:"I wonder who got in trouble" },
      { src:"pat5.JPG", caption:"get bunnied" }
    ]
  },

  {
    key:"peachy",
    name:"Peachy",
    photos:[
      { src:"peachy1.JPG", caption:"classic" },
      { src:"peachy2.JPG", caption:"say cheese!" },
      { src:"peachy4.JPG", caption:"the dentist must have really loved you peachy" },
      { src:"peachy5.JPG", caption:"Family, Beer, and Saturday night fortnite game" },
      { src:"peachy6.JPG", caption:"slime" },
      { src:"peachy7.jpg", caption:"#gigachad #mog #looksmax #mewing" },
      { src:"peachy8.mov", caption:"I actually don't know" }
    ]
  },

  {
    key:"rana",
    name:"Rana",
    photos:[
      { src:"rana1.jpg", caption:"core memory" },
      { src:"rana2.jpg", caption:"Can't believe its almost been 4 years now... time for round 2 mwaha" },
      { src:"rana3.JPG", caption:"timeline jump" },
      { src:"rana5.JPG", caption:"HI" },
      { src:"rana6.jpg", caption:"get pranked adelaide" }
    ]
  }
]
    };

    // ====== STATE ======
    const KEY = "nfc_gift_state_v3";
    const defaultState = {
  stage: "hunt1", // ✅ start on questions
  solved: {1:false,2:false,3:false},
  vaultView: { mode: "people", personKey: null } // ✅ vault opens to name cards
};

    let state = loadState();

    const app = document.getElementById("app");
    const pillText = document.getElementById("pillText");
    const resetBtn = document.getElementById("resetBtn");

    resetBtn.addEventListener("click", () => {
      localStorage.removeItem(KEY);
      state = JSON.parse(JSON.stringify(defaultState));
      render();
    });

    function loadState(){
      try{
        const raw = localStorage.getItem(KEY);
        if(!raw) return JSON.parse(JSON.stringify(defaultState));
        const parsed = JSON.parse(raw);
        const merged = {
          ...defaultState,
          ...parsed,
          solved: {...defaultState.solved, ...(parsed.solved || {})},
          vaultView: parsed.vaultView || defaultState.vaultView
        };

        // Force default to Grandpa gallery if missing
        return merged;
      }catch(e){
        return JSON.parse(JSON.stringify(defaultState));
      }
    }
    function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); }

    function setStage(stage){
      state.stage = stage;
      saveState();
      render();
    }

    function progressCount(){
      return (state.solved[1]?1:0) + (state.solved[2]?1:0) + (state.solved[3]?1:0);
    }

    function renderProgress(){
      const n = progressCount();
      return `
        <div class="status">
          <div class="progress" aria-label="progress">
            <div class="step ${n>=1?'on':''}"></div>
            <div class="step ${n>=2?'on':''}"></div>
            <div class="step ${n>=3?'on':''}"></div>
          </div>
          <div>${n}/3 unlocked</div>
        </div>
      `;
    }

    function render(){
      const n = progressCount();
      pillText.textContent = (state.stage === "vault") ? "vault open" : (n === 0 ? "begin" : `${n}/3 unlocked`);

      if(state.stage === "intro"){
        app.innerHTML = `
          <div class="fade-in">
            <h1>This is for ${escapeHtml(CONFIG.recipientName)}.</h1>
            <p>Not everyone gets access. If you’re here, it’s because someone wanted you to find this.</p>

            <div class="divider"></div>

            <div class="hint">
              One rule: don’t rush it.<br/>
            </div>

            <div class="divider"></div>

            <div class="row">
              <button class="btn primary" id="startBtn">start</button>
              <button class="btn ghost" id="skipBtn" title="Skip straight to the vault (if you want)">skip</button>
            </div>

            ${renderProgress()}
          </div>
        `;
        document.getElementById("startBtn").onclick = () => setStage("hunt1");
        document.getElementById("skipBtn").onclick = () => setStage("vault");
        return;
      }

      if(state.stage === "hunt1"){
        app.innerHTML = `
          <div class="fade-in">
            <h1>Lock 1</h1>
            <p>What was Grandma's first business?</p>

<div class="divider"></div>

<div class="hint">
  Hint: think video games.<br/>
  Answer with two words.
</div>

            <div class="divider"></div>

            <div class="row">
              <input class="input mono" id="ans1" placeholder="type here…" autocomplete="off" />
              <button class="btn good" id="check1">unlock</button>
            </div>

            <div id="msg" class="status"></div>
            ${renderProgress()}

            <div class="divider"></div>
            <div class="row">
              <button class="btn ghost small" id="back">back</button>
            </div>
          </div>
        `;
        document.getElementById("back").onclick = () => setStage("intro");
        document.getElementById("check1").onclick = () => {
          const val = (document.getElementById("ans1").value || "").trim().toLowerCase();
          const ok = val === String(CONFIG.code1).toLowerCase();
          feedback(ok, 1, "hunt2", "Close. Try simpler.");
        };
        return;
      }

      if(state.stage === "hunt2"){
        app.innerHTML = `
          <div class="fade-in">
            <h1>Lock 2</h1>
            <p>This one’s about attention.</p>

            <p>What year did Ryan and Adriana get married?</p>

<div class="divider"></div>

<div class="hint">
  Enter the year as a number.
</div>

            <div class="divider"></div>

            <div class="row">
              <input class="input mono" id="ans2" placeholder="a single number…" inputmode="numeric" autocomplete="off" />
              <button class="btn good" id="check2">unlock</button>
            </div>

            <div id="msg" class="status"></div>
            ${renderProgress()}

            <div class="divider"></div>
            <div class="row">
              <button class="btn ghost small" id="back">back</button>
            </div>
          </div>
        `;
        document.getElementById("back").onclick = () => setStage("hunt1");
        document.getElementById("check2").onclick = () => {
          const val = (document.getElementById("ans2").value || "").trim().toLowerCase();
          const ok = val === String(CONFIG.code2).toLowerCase();
          feedback(ok, 2, "hunt3", "Not that. Try the number you didn’t want to say.");
        };
        return;
      }

      if(state.stage === "hunt3"){
        app.innerHTML = `
          <div class="fade-in">
            <h1>Lock 3</h1>
            <p>The most famous breakfast item.</p>

<div class="divider"></div>

<div class="hint">
  Hint: Grandma used to make it all the time.<br/>
  Three words.
</div>

            <div class="divider"></div>

            <div class="row">
              <input class="input mono" id="ans3" placeholder="three words…" autocomplete="off" />
              <button class="btn good" id="check3">unlock</button>
            </div>

            <div id="msg" class="status"></div>
            ${renderProgress()}

            <div class="divider"></div>
            <div class="row">
              <button class="btn ghost small" id="back">back</button>
            </div>
          </div>
        `;
        document.getElementById("back").onclick = () => setStage("hunt2");
        document.getElementById("check3").onclick = () => {
          const val = (document.getElementById("ans3").value || "").trim().toLowerCase();
          const ok = val === String(CONFIG.code3).toLowerCase();
          if(ok){
  state.solved[3] = true;

  // Force vault to open on NAME GRID (not Grandpa)
  state.vaultView = { mode: "people", personKey: null };

  saveState();
  setStage("vault");
}else{
            document.getElementById("msg").innerHTML =
              `<span style="color:var(--bad)">Not quite.</span> Try the gentlest version of the truth.`;
          }
        };
        return;
      }

     if(state.stage === "vault"){
  const allSolved = state.solved[1] && state.solved[2] && state.solved[3];

  // Default vault landing = people list (NOT grandpa gallery)
  if(!state.vaultView) state.vaultView = { mode: "people", personKey: null };

  const view = state.vaultView;

        // PEOPLE LIST view (optional; you can keep later)
        if(view.mode === "people"){
          app.innerHTML = `
            <div class="fade-in">
              <h1>Vault</h1>
              <p>${allSolved ? "Pick a name." : "You can open it anyway. Pick a name."}</p>

              <div class="divider"></div>

              <div class="vault-grid">
                ${CONFIG.people.map(p => `
                  <div class="drawer" id="person_${p.key}" role="button" tabindex="0">
                    <div class="lock">${p.photos.length} item${p.photos.length === 1 ? "" : "s"}</div>
                    <h3>${escapeHtml(p.name)}</h3>
                    <p class="label">Open.</p>
                  </div>
                `).join("")}
              </div>

              <div class="divider"></div>

              <div class="row">
                <button class="btn ghost small" id="back">back</button>
                <button class="btn primary small" id="finish">close</button>
              </div>
            </div>
          `;

          document.getElementById("back").onclick = () => {
            if(!state.solved[1]) return setStage("hunt1");
            if(!state.solved[2]) return setStage("hunt2");
            if(!state.solved[3]) return setStage("hunt3");
            setStage("hunt3");
          };
          document.getElementById("finish").onclick = () => setStage("intro");

          CONFIG.people.forEach(p => {
            const el = document.getElementById(`person_${p.key}`);
            if(el){
              el.onclick = () => {
                state.vaultView = { mode: "gallery", personKey: p.key };
                saveState();
                render();
              };
            }
          });

          return;
        }

        // GALLERY view (Grandpa default)
        if(view.mode === "gallery"){
          const person = CONFIG.people.find(p => p.key === view.personKey) || CONFIG.people[0];

          app.innerHTML = `
            <div class="fade-in">
              <h1>${escapeHtml(person.name)}</h1>
              <p>Choose a memory.</p>

              <div class="divider"></div>

              <div class="vault-grid">
                ${person.photos.map((ph, idx) => `
                  <div class="drawer" id="item_${idx}" role="button" tabindex="0">
                    <div class="lock">tap</div>
                    <h3>Pic ${idx + 1}</h3>
                    <p class="label">Flip it.</p>
                  </div>
                `).join("")}
              </div>

              <div class="divider"></div>

              <div class="row">
                <button class="btn ghost small" id="peopleBtn">names</button>
                <button class="btn primary small" id="finish">close</button>
              </div>
            </div>
          `;

          document.getElementById("peopleBtn").onclick = () => {
            state.vaultView = { mode: "people", personKey: null };
            saveState();
            render();
          };
          document.getElementById("finish").onclick = () => setStage("intro");

          person.photos.forEach((ph, idx) => {
            const el = document.getElementById(`item_${idx}`);
            if(el){
              el.onclick = () => openMediaModal(person.name, idx + 1, ph.src, ph.caption);
            }
          });

          return;
        }
      }
    }

    function isVideo(src){
      return /\.(mov|mp4|webm)$/i.test(src);
    }

    function openMediaModal(personName, index, src, caption){
      const modal = document.getElementById("modal");
      const flipWrap = document.getElementById("flipWrap");
      const modalTitle = document.getElementById("modalTitle");
      const frontLabel = document.getElementById("frontLabel");
      const modalMediaWrap = document.getElementById("modalMediaWrap");
      const modalCaption = document.getElementById("modalCaption");

      modalTitle.textContent = `${personName} • ${isVideo(src) ? "VIDEO" : "PIC"} ${index}`;
      frontLabel.textContent = isVideo(src) ? `Video ${index}` : `Pic ${index}`;
      modalCaption.innerHTML = `
  <span class="capTitle">Description</span>
  ${escapeHtml(caption || "")}
`;

      // Reset flip + media
      flipWrap.classList.remove("flipped");
      modalMediaWrap.innerHTML = "";

      if(isVideo(src)){
        const v = document.createElement("video");
        v.src = src;
        v.className = "modalMedia";
        v.autoplay = true;
        v.loop = true;
        v.muted = true;
        v.playsInline = true;
        v.controls = false;
        modalMediaWrap.appendChild(v);
      }else{
        const img = document.createElement("img");
        img.src = src;
        img.alt = caption || "Selected image";
        img.className = "modalMedia";
        modalMediaWrap.appendChild(img);
      }

      modal.classList.add("on");

      // Flip handler (tap anywhere on card)
      flipWrap.onclick = () => {
        flipWrap.classList.toggle("flipped");
        // If flipping back to front, pause video (optional)
        const vid = modalMediaWrap.querySelector("video");
        if(vid && !flipWrap.classList.contains("flipped")) vid.pause();
        if(vid && flipWrap.classList.contains("flipped")) vid.play().catch(()=>{});
      };
    }

    function closeMediaModal(){
      const modal = document.getElementById("modal");
      const flipWrap = document.getElementById("flipWrap");
      const modalMediaWrap = document.getElementById("modalMediaWrap");

      // stop video if any
      const vid = modalMediaWrap.querySelector("video");
      if(vid) vid.pause();

      modal.classList.remove("on");
      flipWrap.classList.remove("flipped");
      modalMediaWrap.innerHTML = "";
    }

    document.getElementById("closeModal").onclick = closeMediaModal;
    document.getElementById("modal").addEventListener("click", (e) => {
      if(e.target && e.target.id === "modal") closeMediaModal();
    });
    document.addEventListener("keydown", (e) => {
      const modal = document.getElementById("modal");
      if(e.key === "Escape" && modal.classList.contains("on")) closeMediaModal();
    });

    function feedback(ok, lockNum, nextStage, wrongCopy){
      const msg = document.getElementById("msg");
      if(ok){
        state.solved[lockNum] = true;
        saveState();
        msg.innerHTML = `<span style="color:var(--ok)">Unlocked.</span> Don’t rush.`;
        setTimeout(()=> setStage(nextStage), 520);
      }else{
        msg.innerHTML = `<span style="color:var(--bad)">No.</span> ${wrongCopy}`;
      }
    }

    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[s]);
    }

    // Auto-open vault if all solved and they revisit
    if(state.solved[1] && state.solved[2] && state.solved[3] && state.stage !== "vault"){
      state.stage = "vault";
      saveState();
    }

    render();

  } catch (e) {
    console.error(e);
    const app = document.getElementById("app");
    const pill = document.getElementById("pillText");
    if (pill) pill.textContent = "error";
    if (app) {
      app.innerHTML = `
        <div style="padding:22px">
          <h1 style="margin:0 0 10px;">Script crashed</h1>
          <p style="color:#a8b0c6; line-height:1.6; margin:0 0 12px;">
            Your JS is failing, so the page content never renders.
            <br/>Here’s the exact error:
          </p>
          <pre style="white-space:pre-wrap; background:rgba(0,0,0,.25); padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.12); color:#e8ecf7; margin:0;">${String(e)}</pre>
        </div>
      `;
    }
  }
})();
</script>
</body>
</html>
